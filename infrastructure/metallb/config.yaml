# MetalLB Configuration for Home Infrastructure
# Provides LoadBalancer capabilities for bare-metal Kubernetes

# IP Address Pool
# Configure the range of IP addresses MetalLB can assign to LoadBalancer services
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default-pool
  namespace: metallb-system
spec:
  addresses:
  - 192.168.100.10-192.168.100.254  # Adjust to match your network
  # You can also specify individual IPs or multiple ranges:
  # - 192.168.1.240-192.168.1.250
  # - 192.168.1.200/32

# L2 Advertisement
# Advertises the LoadBalancer IPs using Layer 2 (ARP)
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default
  namespace: metallb-system
spec:
  ipAddressPools:
  - default-pool
  # Optional: Specify which network interfaces to use
  # interfaces:
  # - eth0
