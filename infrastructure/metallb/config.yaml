#   namespace: metallb-system
#   labels:
#     app.kubernetes.io/component: controller
#     app.kubernetes.io/instance: metallb
#     app.kubernetes.io/name: metallb
#   annotations:
#     metallb.io/address-pool: default-pool  # optional: pin to a pool
# spec:
#   selector:
#     app.kubernetes.io/component: controller
#     app.kubernetes.io/instance: metallb
#     app.kubernetes.io/name: metallb
#   ports:
#     - name: metrics
#       port: 7472
#       targetPort: 7472
#       protocol: TCP
#   type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: metallb-controller-metrics
  namespace: metallb-system
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: metallb
    app.kubernetes.io/name: metallb
spec:
  selector:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: metallb
    app.kubernetes.io/name: metallb
  ports:
    - name: metrics
      port: 7472
      targetPort: 7472
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: metallb-controller-metrics
  namespace: metallb-system
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: metallb
    app.kubernetes.io/name: metallb
spec:
  entryPoints:
    - web          # port 80, or use 'websecure' for 443
  routes:
    - match: Host(`metallb.cluster.example.net`)
      kind: Rule
      services:
        - name: metallb-controller-metrics
          port: 7472