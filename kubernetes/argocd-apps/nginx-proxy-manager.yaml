apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-proxy-manager-new
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@forgejo.example.net:nmcglo/home-infra.git
    targetRevision: HEAD
    path: kubernetes/apps/nginx-proxy-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-pm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
