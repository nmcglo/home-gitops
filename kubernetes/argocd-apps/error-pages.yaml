apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: error-pages
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nmcglo/home-infra.git
    targetRevision: HEAD  # Uses default branch
    path: kubernetes/apps/error-pages
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
