apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rockllama
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com/nmcglo/home-infra.git
    targetRevision: HEAD
    path: kubernetes/apps/rockllama
  destination:
    server: https://kubernetes.default.svc
    namespace: rockllama
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
