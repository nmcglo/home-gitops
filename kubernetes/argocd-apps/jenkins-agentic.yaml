apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins-agentic
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@forgejo.example.net:nmcglo/home-infra.git
    targetRevision: HEAD  # Uses default branch
    path: kubernetes/apps/jenkins
    helm:
      releaseName: jenkins-agentic
      valueFiles:
        - values-agentic.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins-agentic
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
