apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: emby-exporter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nmcglo/home-infra.git
    targetRevision: HEAD
    path: kubernetes/apps/emby-exporter
  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus-exporters
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
