apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-postgres
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  strategy:
    type: Replace
  selector:
    matchLabels:
      app: {{ .Release.Name }}-postgres
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              {{- if kindIs "string" .Values.postgres.user }}
              value: {{ .Values.postgres.user | quote }}
              {{- else }}
              {{- toYaml .Values.postgres.user | nindent 14 }}
              {{- end }}
            - name: POSTGRES_PASSWORD
              {{- if kindIs "string" .Values.postgres.password }}
              value: {{ .Values.postgres.password | quote }}
              {{- else }}
              {{- toYaml .Values.postgres.password | nindent 14 }}
              {{- end }}
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-pgdata-pvc
