apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          command: ["node", "dist/src/harness.js", "--start-docker"]
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            # --- Fixed service wiring (in-cluster DNS to the other components) ---
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: ENV
              value: "local"
            - name: REDIS_URL
              value: "redis://{{ .Release.Name }}-redis:6379"
            - name: REDIS_RATE_LIMIT_URL
              value: "redis://{{ .Release.Name }}-redis:6379"
            - name: PLAYWRIGHT_MICROSERVICE_URL
              value: "http://{{ .Release.Name }}-playwright:3000/scrape"
            - name: NUQ_RABBITMQ_URL
              value: "amqp://{{ .Release.Name }}-rabbitmq:5672"
            - name: POSTGRES_HOST
              value: "{{ .Release.Name }}-postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.db | quote }}

            # --- 1Password-sourced secret env vars (omit if onepasswordSecrets is empty) ---
            {{- range .Values.onepasswordSecrets }}
            {{- if .enabled }}
            {{- $secretName := .name }}
            {{- range .env }}
            - name: {{ .envVar }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ .secretKey }}
            {{- end }}
            {{- end }}
            {{- end }}

            # --- Plain env vars from values.yaml (see values.yaml for the full list) ---
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
