namespace: homepage

revisionHistoryLimit: 1

image:
  repository: ghcr.io/gethomepage/homepage
  tag: latest
  pullPolicy: Always

service:
  type: LoadBalancer
  port: 3000
  targetPort: http
  loadBalancerIP: ""  # Set to a specific IP for MetalLB static assignment, e.g. "192.168.100.X"

# Extra hostnames (besides the pod IP, which is always included automatically)
# allowed to reach homepage. Comma-separated. See:
# https://gethomepage.dev/installation/#homepage_allowed_hosts
allowedHosts: "home.example.net"

# Kubernetes service-discovery RBAC (ServiceAccount + ClusterRole + ClusterRoleBinding).
# Required for the `kubernetes` widget and for auto-discovering annotated
# Ingresses/IngressRoutes/HTTPRoutes cluster-wide. See:
# https://gethomepage.dev/installation/k8s/
rbac:
  enabled: true

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # limits:
  #   cpu: 500m
  #   memory: 512Mi

# 1Password operator managed secrets, used to populate widget API keys as
# HOMEPAGE_VAR_* environment variables, referenced from services.yaml as
# "{{HOMEPAGE_VAR_NAME}}". Reuses the same 1Password items as the gatus chart.
onepasswordSecrets:

  - name: paperless-ngx-creds
    enabled: true
    itemPath: "vaults/home-gitops/items/Paperless API Token"
    env:
      - envVar: HOMEPAGE_VAR_PAPERLESS_API_TOKEN
        secretKey: credential

# Homepage configuration files - see https://gethomepage.dev/configs/ for full reference.
# Each of these is mounted verbatim into /app/config/<key>.yaml (or .css/.js).
config:
  settings: |
    title: Example.net
    favicon: https://gethomepage.dev/icons/favicon.ico
    theme: dark
    color: slate
    headerStyle: boxed
    layout:
      Home:
        style: row
        columns: 4
        tab: Home
      Extra:
        style: row
        columns: 4
        tab: Detailed
      Cluster Infrastructure:
        style: row
        columns: 4
        tab: Detailed
      Network:
        style: row
        columns: 4
        tab: Detailed
      Local LLMs:
        style: row
        columns: 4
        tab: Detailed
      Local LLMs Extra:
        style: row
        columns: 4
        tab: Detailed
      Developer:
        tab: Detailed
    providers: {}

  kubernetes: |
    mode: cluster

  bookmarks: |
    - Developer:
        - Forgejo:
            - abbr: FJ
              href: https://forgejo.example.net
        - ArgoCD:
            - abbr: CD
              href: https://argocd.example.net

  services: |
    - Cluster Infrastructure:
        - ArgoCD:
            icon: argocd.png
            href: https://argocd.example.net
            description: GitOps continuous delivery

        - Longhorn:
            icon: longhorn.png
            href: https://longhorn.example.net
            description: Distributed block storage

        - Traefik:
            icon: traefik.png
            href: https://traefik.cluster.example.net
            description: Ingress controller

        - 1Password Connect:
            icon: 1password.png
            href: https://onepassword.cluster.example.net
            description: Secrets operator

        - Forgejo:
            icon: forgejo.png
            href: https://forgejo.example.net
            description: Git hosting

        - Docker Registry:
            icon: docker.png
            href: https://registry.example.net
            description: Container image registry

        - Jenkins:
            icon: jenkins.png
            href: https://jenkins.example.net
            description: CI/CD automation

        - NGINX Proxy Manager:
            icon: nginx-proxy-manager.png
            href: https://proxy.example.net
            description: Reverse proxy / TLS termination

    - Network:
        - AdGuard Home (HAOS):
            icon: adguard-home.png
            href: https://adguard.example.net
            description: DNS ad-blocking (Home Assistant host)

        - AdGuard Home (Cluster):
            icon: adguard-home.png
            href: https://adguard1.example.net
            description: DNS ad-blocking (in-cluster)

        - AdGuard Home Sync:
            icon: adguard-home.png
            href: https://adguard-sync.example.net
            description: Keeps AdGuard instances in sync

    - Home:
        - Home Assistant:
            icon: home-assistant.png
            href: https://ha.example.net
            description: Home automation

        - Emby:
            icon: emby.png
            href: https://emby.example.net
            description: Media server

        - Mealie:
            icon: mealie.png
            href: https://mealie.example.net
            description: Recipe manager

        - Paperless-NGX:
            icon: paperless-ngx.png
            href: https://paperless.example.net
            description: Document management
            widget:
              type: paperlessngx
              url: https://paperless.example.net
              key: "{{HOMEPAGE_VAR_PAPERLESS_API_TOKEN}}"

        - Audiobookshelf:
            icon: audiobookshelf.png
            href: https://books.example.net
            description: Audiobook & podcast server

        - Kiwix:
            icon: kiwix.png
            href: https://kiwix.example.net
            description: Offline content archive

        - Gatus:
            icon: gatus.png
            href: https://gatus.example.net
            description: Example.net Services Status Page

    - Extra:
        - TronByt Server:
          icon: tronbyt.png
          href: https://tronbyt.example.net
          description: Tidbyt-compatible display server

        - Garage S3:
            icon: garage.png
            href: https://garage.example.net
            description: S3-compatible object storage

    - Local LLMs:
        - Open WebUI:
            icon: open-webui.png
            href: https://chat.example.net
            description: LLM chat interface

    - Local LLMs Extra:
        - RK3588 llama.cpp:
            icon: llama.png
            href: https://rkllama.example.net
            description: llama.cpp on RK3588 NPU

  widgets: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - search:
        provider: brave
        target: _blank

  proxmox: ""

  docker: ""

  customCss: ""

  customJs: ""
