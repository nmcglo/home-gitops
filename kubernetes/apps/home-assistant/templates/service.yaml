apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
  - name: http
    protocol: TCP
    port: {{ .Values.service.ports.http }}
    targetPort: {{ .Values.service.targetPort }}
  - name: https
    protocol: TCP
    port: {{ .Values.service.ports.https }}
    targetPort: {{ .Values.service.targetPort }}
  type: {{ .Values.service.type }}
