apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
      - name: onedev
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.http.targetPort }}
          name: http
        - containerPort: {{ .Values.service.ssh.targetPort }}
          name: ssh
        {{- if or .Values.env .Values.onepasswordSecrets }}
        env:
        {{- range .Values.env }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        {{- range .Values.onepasswordSecrets }}
        {{- if .enabled }}
        {{- $secretName := .name }}
        {{- range .env }}
        - name: {{ .envVar }}
          valueFrom:
            secretKeyRef:
              name: {{ $secretName }}
              key: {{ .secretKey }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        volumeMounts:
        - name: data
          mountPath: /opt/onedev
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        {{- if .Values.resources }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}
      volumes:
      {{- if .Values.persistence.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-pvc
      {{- else }}
      - name: data
        emptyDir: {}
      {{- end }}
