nameOverride: ""
fullnameOverride: ""

namespace:
  create: true
  name: adguard

persistence:
  enabled: true
  size: 5Gi
  storageClassName: longhorn

service:
  type: LoadBalancer
  # loadBalancerIP: 192.168.100.13
  loadBalancerIP: 192.168.100.21
  ports:
    httpinitial:
      port: 3000
      targetPort: 3000
      protocol: TCP
    http:
      port: 80
      targetPort: 80
      protocol: TCP
    dns:
      port: 53
      targetPort: 53
      protocol: UDP

image:
  repository: adguard/adguardhome
  tag: v0.107.74
  pullPolicy: IfNotPresent

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
