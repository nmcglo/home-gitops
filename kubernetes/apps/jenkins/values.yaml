namespace: jenkins

revisionHistoryLimit: 2

image:
  repository: jenkins/jenkins
  tag: "2.582"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 8080
  targetPort: 8080
  agentPort: 50000
  agentTargetPort: 50000
  loadBalancerIP: "192.168.100.25"  # Set to a specific IP for MetalLB static assignment, e.g. "192.168.100.21"

persistence:
  enabled: true
  storageClass: "longhorn"
  accessMode: ReadWriteMany
  size: 50Gi

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 2Gi

# Java options passed to Jenkins JVM
javaOpts: "-Djenkins.install.runSetupWizard=false"

# 1Password operator managed secrets.
# Each entry creates a OnePasswordItem which the operator syncs into a Kubernetes Secret
# of the same name. Fields from that secret can then be mapped to environment variables.
# jenkins-admin-creds below supplies the JCasC-configured admin login further down —
# create a Login item at that path with "username"/"password" fields before deploying.

# Plugins installed by the init container via jenkins-plugin-cli at startup.
# Format: "plugin-id:version" — use "latest" to always pull the newest compatible version.
plugins:
  - "kubernetes:latest"
  - "workflow-aggregator:latest"   # Pipelines (includes pipeline-*, multibranch, etc.)
  - "git:latest"
  - "configuration-as-code:latest"
  - "credentials-binding:latest"
  - "job-dsl:latest"
  - "dark-theme:latest"
  - "solarized-theme:latest"
  - "role-strategy:latest"        # Role-based authorization (global + per-project roles)

# Jenkins Configuration as Code (JCasC).
# Mounted into the container and loaded via CASC_JENKINS_CONFIG.
# The Kubernetes cloud config below points Jenkins at the in-cluster API so it can
# spin up ephemeral agent pods for builds.
jcasc:
  enabled: true
  config: |
    jenkins:
      # Local user database. The admin account's credentials are injected as env vars
      # (JENKINS_ADMIN_ID / JENKINS_ADMIN_PASSWORD) from the 1Password item below, and
      # JCasC interpolates them with ${...} — the actual password never lands in this file.
      securityRealm:
        local:
          allowsSignup: false
          users:
            - id: "${JENKINS_ADMIN_ID}"
              password: "${JENKINS_ADMIN_PASSWORD}"
      # Role Strategy plugin: one set of global roles (coarse capabilities) plus
      # per-project/folder roles (fine-grained access scoped by job name pattern).
      authorizationStrategy:
        roleBased:
          roles:
            global:
              - name: "admin"
                description: "Full administrative access"
                permissions:
                  - "Overall/Administer"
                entries:
                  - user: "${JENKINS_ADMIN_ID}"
              - name: "developer"
                description: "Baseline for logged-in users — global read only, no job access by default"
                permissions:
                  - "Overall/Read"
                  - "View/Read"
                entries:
                  - group: "authenticated"
            # Per-project roles grant additional permissions on top of the global roles,
            # scoped to jobs/folders whose name matches `pattern`. This is what gives
            # granular (per-team/per-folder) access instead of all-or-nothing.
            # Example: any authenticated user can build/cancel/read jobs under a
            # "public-" prefix; everything else stays invisible to them since the
            # "developer" global role above grants no Job/* permissions.
            items:
              - name: "public-jobs"
                description: "Example project role — full build access to jobs prefixed public-"
                pattern: "public-.*"
                permissions:
                  - "Job/Build"
                  - "Job/Cancel"
                  - "Job/Read"
                  - "Job/Workspace"
                entries:
                  - group: "authenticated"
      clouds:
        - kubernetes:
            name: "kubernetes"
            namespace: "jenkins"
            jenkinsUrl: "https://jenkins.example.net"
            jenkinsTunnel: "https://jenkins-service.example.net"
            containerCapStr: "10"
            templates:
              - name: "default"
                label: "kubernetes"
                nodeUsageMode: NORMAL
                containers:
                  - name: "jnlp"
                    image: "jenkins/inbound-agent:latest"
                    alwaysPullImage: false
                    workingDir: "/home/jenkins/agent"
                    ttyEnabled: false
                    resourceRequestCpu: "100m"
                    resourceRequestMemory: "256Mi"
                    resourceLimitCpu: "500m"
                    resourceLimitMemory: "512Mi"
    appearance:
      prism:
        theme: PRISM
      themeManager:
        disableUserThemes: false
        theme: "solarizedSystem"

onepasswordSecrets:
  - name: jenkins-admin-creds
    enabled: true
    itemPath: "vaults/home-gitops/items/Jenkins Admin"
    autoRestart: "true"
    env:
      - envVar: JENKINS_ADMIN_ID
        secretKey: username
      - envVar: JENKINS_ADMIN_PASSWORD
        secretKey: password

# RBAC for the Kubernetes plugin (dynamic build agents).
# Grants the Jenkins ServiceAccount permission to create/delete pods in agentNamespace.
# agentNamespace can match the Jenkins namespace or be a dedicated namespace for agents.
rbac:
  enabled: true
  agentNamespace: jenkins
