# Name is intentionally the literal "backend", not {{ .Release.Name }}-backend: the
# frontend image's nginx config proxies /api to http://backend:8000 verbatim (baked
# in at build time), and the mcp service's BACKEND_URL default in values.yaml points
# at the same hostname. Renaming this Service breaks both.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}
      name: http
