{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mcp
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}-mcp
spec:
  type: {{ .Values.mcp.service.type }}
  {{- if .Values.mcp.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.mcp.service.loadBalancerIP }}
  {{- end }}
  selector:
    app: {{ .Release.Name }}-mcp
  ports:
    - port: {{ .Values.mcp.service.port }}
      targetPort: {{ .Values.mcp.service.targetPort }}
      name: http
{{- end }}
