# Global settings
global:
  namespace: monitoring

# Prometheus configuration
prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 9090
  persistence:
    enabled: true
    size: 50Gi
    accessMode: ReadWriteMany
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  scrape_interval: 5s
  evaluation_interval: 5s
  scrapeConfigs:
    - job_name: 'prometheus'
      static_configs:
        - targets: ['localhost:9090']
    - job_name: 'qbittorrent-exporter'
      static_configs:
        - targets: ['qbittorrent-exporter.prometheus-exporters.svc.cluster.local:8080']
    - job_name: 'emby-exporter'
      static_configs:
        - targets: ['emby-exporter.prometheus-exporters.svc.cluster.local:8080']
