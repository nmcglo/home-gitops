# Grafana configuration
grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 3000
  persistence:
    enabled: true
    size: 50Gi
    accessMode: ReadWriteMany
  resources:
    requests:
      cpu: 250m
      memory: 750Mi
    limits:
      cpu: 500m
      memory: 1Gi
  securityContext:
    fsGroup: 472
    supplementalGroups:
      - 0
  admin:
    # Use existing secret instead of creating one
    existingSecret: ""
    # Secret keys for admin credentials
    userKey: admin-user
    passwordKey: admin-password
    # Admin credentials (only used if existingSecret is not set)
    user: admin
    password: admin
  datasources:
    - name: Prometheus
      type: prometheus
      # Either specify a full URL
      # url: http://prometheus:9090
      # Or specify a service name and port (will be resolved to http://<release-name>-prometheus:9090)
      serviceName: prometheus
      servicePort: 9090
      access: proxy
      isDefault: true
