namespace: litellm

onepasswordSecrets:
  - name: litellm-secrets
    enabled: true
    autoRestart: true
    itemPath: "vaults/home-gitops/items/LiteLLM Master Key"
    env:
      - envVar: LITELLM_MASTER_KEY
        secretKey: credential
      - envVar: POSTGRES_PASSWORD
        secretKey: postgres_password

image:
  repository: ghcr.io/berriai/litellm
  tag: main-latest
  pullPolicy: IfNotPresent

env: {}

service:
  type: LoadBalancer
  port: 4000
  targetPort: 4000
  loadBalancerIP: ""

persistence:
  storageClassName: longhorn
  accessMode: ReadWriteOnce
  size: 5Gi

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  username: litellm
  # Password stored in 1Password — set via POSTGRES_PASSWORD env var
  database: litellm
  port: 5432
  storage:
    storageClassName: longhorn
    accessMode: ReadWriteOnce
    size: 5Gi

# LiteLLM configuration — mounted at /etc/litellm/config.yaml
config:
  model_list:
  - model_name: "qwen3.6:27b-mtp"
    litellm_params:
      model: "openai/qwen3.6:27b-mtp"
      api_base: "https://localai.example.net"
      api_key: "nokey"
      drop_params: true
  # general_settings:
    # database_url: "postgresql://litellm:$(POSTGRES_PASSWORD)@postgres:5432/litellm"
  # Example:
  # - model_name: gpt-4
  #   litellm_params:
  #     model: openai/gpt-4
