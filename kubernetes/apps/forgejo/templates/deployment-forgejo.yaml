{{- $waitForPostgres := and (eq .Values.database.type "postgres") .Values.database.postgres.internal }}
{{- $genTlsCert := .Values.forgejo.tls.selfSigned.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      {{- if or $waitForPostgres $genTlsCert }}
      initContainers:
        {{- if $waitForPostgres }}
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Release.Name }}-postgres {{ .Values.database.postgres.port }}; do
                echo "waiting for postgres..."; sleep 2
              done
        {{- end }}
        {{- if $genTlsCert }}
        - name: generate-tls-cert
          image: "{{ .Values.forgejo.tls.selfSigned.image.repository }}:{{ .Values.forgejo.tls.selfSigned.image.tag }}"
          imagePullPolicy: {{ .Values.forgejo.tls.selfSigned.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              apk add --no-cache openssl
              openssl req -x509 -newkey rsa:4096 \
                -keyout /certs/key.pem \
                -out /certs/cert.pem \
                -days {{ .Values.forgejo.tls.selfSigned.days }} \
                -nodes \
                -subj "/CN={{ .Values.forgejo.config.server.domain }}" \
                -addext "subjectAltName=DNS:{{ .Values.forgejo.config.server.domain }}"
              chmod 0:1000 /certs/cert.pem /certs/key.pem
              chown g+r /certs/cert.pem /certs/key.pem
          volumeMounts:
            - name: tls-certs
              mountPath: /certs
        {{- end }}
      {{- end }}
      containers:
        - name: forgejo
          image: "{{ .Values.forgejo.image.repository }}:{{ .Values.forgejo.image.tag }}"
          imagePullPolicy: {{ .Values.forgejo.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.forgejo.config.server.httpPort }}
            - name: ssh
              containerPort: {{ .Values.forgejo.config.server.sshListenPort }}
          env:
            # Server
            - name: FORGEJO__SERVER__DOMAIN
              value: {{ .Values.forgejo.config.server.domain | quote }}
            - name: FORGEJO__SERVER__ROOT_URL
              value: {{ .Values.forgejo.config.server.rootUrl | quote }}
            - name: FORGEJO__SERVER__HTTP_PORT
              value: {{ .Values.forgejo.config.server.httpPort | quote }}
            - name: FORGEJO__SERVER__SSH_DOMAIN
              value: {{ .Values.forgejo.config.server.sshDomain | quote }}
            - name: FORGEJO__SERVER__SSH_PORT
              value: {{ .Values.forgejo.config.server.sshPort | quote }}
            - name: FORGEJO__SERVER__SSH_LISTEN_PORT
              value: {{ .Values.forgejo.config.server.sshListenPort | quote }}
            - name: FORGEJO__SERVER__DISABLE_SSH
              value: {{ .Values.forgejo.config.server.disableSsh | quote }}
            - name: FORGEJO__SERVER__START_SSH_SERVER
              value: {{ .Values.forgejo.config.server.startSshServer | quote }}
            {{- if $genTlsCert }}
            - name: FORGEJO__SERVER__PROTOCOL
              value: https
            - name: FORGEJO__SERVER__CERT_FILE
              value: /certs/cert.pem
            - name: FORGEJO__SERVER__KEY_FILE
              value: /certs/key.pem
            {{- end }}
            # Security
            - name: FORGEJO__SECURITY__INSTALL_LOCK
              value: {{ .Values.forgejo.config.security.installLock | quote }}
            - name: FORGEJO__SECURITY__SECRET_KEY
              {{- if kindIs "string" .Values.forgejo.config.security.secretKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: FORGEJO__SECURITY__SECRET_KEY
              {{- else }}
              {{- toYaml .Values.forgejo.config.security.secretKey | nindent 14 }}
              {{- end }}
            # Repository
            - name: FORGEJO__REPOSITORY__ROOT
              value: {{ .Values.forgejo.config.repository.root | quote }}
            # Log
            - name: FORGEJO__LOG__MODE
              value: console
            - name: FORGEJO__LOG__LEVEL
              value: {{ .Values.forgejo.config.log.level | quote }}
            # Database
            {{- if eq .Values.database.type "sqlite" }}
            - name: FORGEJO__DATABASE__DB_TYPE
              value: sqlite3
            - name: FORGEJO__DATABASE__PATH
              value: /data/gitea/gitea.db
            {{- else }}
            - name: FORGEJO__DATABASE__DB_TYPE
              value: postgres
            - name: FORGEJO__DATABASE__HOST
              {{- if .Values.database.postgres.internal }}
              value: {{ printf "%s-postgres:%d" .Release.Name (.Values.database.postgres.port | int) | quote }}
              {{- else }}
              value: {{ printf "%s:%d" .Values.database.postgres.host (.Values.database.postgres.port | int) | quote }}
              {{- end }}
            - name: FORGEJO__DATABASE__NAME
              value: {{ .Values.database.postgres.name | quote }}
            - name: FORGEJO__DATABASE__USER
              value: {{ .Values.database.postgres.user | quote }}
            - name: FORGEJO__DATABASE__PASSWD
              {{- if kindIs "string" .Values.database.postgres.password }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: FORGEJO__DATABASE__PASSWD
              {{- else }}
              {{- toYaml .Values.database.postgres.password | nindent 14 }}
              {{- end }}
            - name: FORGEJO__DATABASE__SSL_MODE
              value: {{ .Values.database.postgres.sslMode | quote }}
            {{- end }}
            # Extra environment variables
            {{- range $key, $value := .Values.forgejo.extraEnv }}
            - name: {{ $key }}
              {{- if kindIs "string" $value }}
              value: {{ $value | quote }}
              {{- else }}
              {{- toYaml $value | nindent 14 }}
              {{- end }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if $genTlsCert }}
            - name: tls-certs
              mountPath: /certs
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data-pvc
        {{- if $genTlsCert }}
        - name: tls-certs
          emptyDir: {}
        {{- end }}
