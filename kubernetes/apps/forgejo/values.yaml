# Default values for forgejo

namespace: forgejo

forgejo:
  image:
    repository: codeberg.org/forgejo/forgejo
    tag: "15"
    pullPolicy: IfNotPresent

  # strategy controls the Deployment rollout strategy.
  # Recreate (default) terminates the old pod before starting the new one —
  # required when the data PVC uses ReadWriteOnce.
  # RollingUpdate keeps a fraction of old pods alive during the transition;
  # only safe if the PVC uses ReadWriteMany or you accept brief dual-access.
  strategy:
    type: Recreate
    # rollingUpdate is only applied when type: RollingUpdate
    # rollingUpdate:
    #   maxSurge: 1
    #   maxUnavailable: 0

  config:
    server:
      domain: "forgejo.example.net"
      rootUrl: "https://forgejo.example.net"
      httpPort: 3000
      # sshDomain is the hostname shown in clone URLs
      sshDomain: "forgejo.example.net"
      # sshPort is the external port shown in clone URLs
      sshPort: 22
      # sshListenPort is the port Forgejo's SSH server listens on inside the container;
      # service.ssh.targetPort should match this value
      sshListenPort: 2222
      disableSsh: false
      # startSshServer must be true in Kubernetes (no host SSH daemon available)
      startSshServer: true
    security:
      # Change this to a long random string before deploying
      secretKey:
        valueFrom:
          secretKeyRef:
            name: forgejo-secret-key
            key: FORGEJO__SECURITY__SECRET_KEY
      installLock: true
    repository:
      root: /data/git/repositories
    log:
      level: Info
    lfs:
      # enabled toggles the LFS server endpoint (FORGEJO__SERVER__LFS_START_SERVER)
      enabled: true
      # path where LFS objects are stored; lives inside the data PVC
      path: /data/git/lfs

  # TLS — optional self-signed certificate generated at pod startup.
  # When enabled, an init container runs openssl to produce a cert/key pair in
  # an emptyDir volume, and Forgejo is configured to serve HTTPS directly.
  # Disable this when TLS termination is handled upstream (e.g. nginx, cloudflared).
  # TLS — choose at most one mode. selfSigned and certManager are mutually exclusive.
  tls:
    # selfSigned: init container runs openssl at pod startup and writes a cert/key
    # pair into an emptyDir volume. Good for internal/homelab use with no CA.
    selfSigned:
      enabled: false
      # Validity period for the generated certificate in days
      days: 3650
      image:
        repository: alpine
        tag: "3"
        pullPolicy: IfNotPresent
    # certManager: creates a cert-manager Certificate resource and mounts the
    # resulting Secret into the Forgejo container. Requires cert-manager to be
    # installed in the cluster.
    certManager:
      enabled: true
      # issuerRef identifies the cert-manager Issuer or ClusterIssuer to use
      issuerRef:
        name: "letsencrypt-prod"
        # kind: ClusterIssuer | Issuer
        kind: ClusterIssuer
        group: cert-manager.io
      # secretName is the Kubernetes Secret cert-manager will create/manage.
      # Defaults to <release-name>-tls-cert if left empty.
      secretName: "forgejo-example-net-cert"
      # duration and renewBefore use Go duration strings (e.g. "2160h" = 90 days)
      duration:
      renewBefore:

  # Additional environment variables injected into the Forgejo container.
  # Plain strings and valueFrom references are both supported (same syntax as
  # paperless-ngx extraEnv).
  extraEnv:
    USE_COMPAT_SSH_URI: "False"

# Database configuration
# database.type: sqlite | postgres
#
# sqlite  — no extra pods; data stored in the data PVC
# postgres with internal: true  — a Postgres pod is deployed alongside Forgejo
# postgres with internal: false — Forgejo connects to an existing Postgres instance
database:
  type: sqlite
  postgres:
    # internal: true  → deploy a bundled Postgres pod
    # internal: false → use the host/port below
    internal: true
    # host is only used when internal: false
    host: ""
    port: 5432
    name: forgejo
    user: forgejo
    # password accepts a plain string or a valueFrom reference, e.g.:
    #   password:
    #     valueFrom:
    #       secretKeyRef:
    #         name: forgejo-db-password
    #         key: value
    password: changeme
    sslMode: disable
    image:
      repository: docker.io/library/postgres
      tag: "16"
      pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  web:
    port: 443
    targetPort: 3000
  ssh:
    enabled: true
    port: 22
    # targetPort must match forgejo.config.server.sshListenPort
    targetPort: 2222

persistence:
  data:
    storageClassName: longhorn
    accessMode: ReadWriteOnce
    size: 100Gi
  # pgdata is only provisioned when database.type=postgres and database.postgres.internal=true
  # pgdata:
  #   storageClassName: longhorn
  #   accessMode: ReadWriteOnce
  #   size: 100Gi

# OnePassword operator secrets — same schema as other apps in this repo
onepasswordSecrets:
- name: forgejo-secret-key
  enabled: true
  autoRestart: true
  itemPath: "vaults/home-gitops/items/Forgejo Secrets"
