apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-redisdata-pvc
  namespace: {{ .Values.namespace }}
spec:
  storageClassName: {{ .Values.persistence.redis.storageClassName }}
  accessModes:
    - {{ .Values.persistence.redis.accessMode }}
  resources:
    requests:
      storage: {{ .Values.persistence.redis.size }}
