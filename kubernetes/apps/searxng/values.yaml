# Default values for searxng

namespace: searxng

onepasswordSecrets: []
# Example (only needed if you want a fixed instance secret key across replicas):
# - name: searxng-secret
#   enabled: true
#   autoRestart: true
#   itemPath: "vaults/home-gitops/items/searxng_secret"
#   env:
#     - envVar: SEARXNG_SECRET
#       secretKey: secret-key

image:
  repository: docker.io/searxng/searxng
  tag: latest
  pullPolicy: IfNotPresent

env:
  SEARXNG_BASE_URL: "https://searxng.example.net/"
  UWSGI_WORKERS: "4"
  UWSGI_THREADS: "4"
  SEARXNG_REDIS_URL: "redis://searxng-redis:6379/0"

service:
  type: LoadBalancer
  port: 8080
  targetPort: 8080
  loadBalancerIP: ""   # Set to a static IP for MetalLB, e.g. "192.168.100.X"

persistence:
  searxng:
    storageClassName: longhorn
    accessMode: ReadWriteOnce
    size: 10Gi
  redis:
    storageClassName: longhorn
    accessMode: ReadWriteOnce
    size: 1Gi

redis:
  image:
    repository: docker.io/library/redis
    tag: "8.6"
    pullPolicy: IfNotPresent
