apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      {{- if .Values.tls.selfSigned.enabled }}
      initContainers:
      - name: gen-tls-cert
        image: {{ .Values.tls.selfSigned.initImage }}
        command:
        - sh
        - -c
        - |
          apk add --no-cache openssl
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
            -keyout /certs/tls.key \
            -out /certs/tls.crt \
            -subj "/CN={{ .Release.Name }}"
        volumeMounts:
        - name: tls-certs
          mountPath: /certs
      {{- end }}
      containers:
      - name: actual-budget
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.targetPort }}
          name: http
        {{- if or .Values.env .Values.onepasswordSecrets .Values.tls.selfSigned.enabled }}
        env:
        {{- range .Values.env }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        {{- range .Values.onepasswordSecrets }}
        {{- if .enabled }}
        {{- $secretName := .name }}
        {{- range .env }}
        - name: {{ .envVar }}
          valueFrom:
            secretKeyRef:
              name: {{ $secretName }}
              key: {{ .secretKey }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- if .Values.tls.selfSigned.enabled }}
        - name: ACTUAL_HTTPS_CERT
          value: "/certs/tls.crt"
        - name: ACTUAL_HTTPS_KEY
          value: "/certs/tls.key"
        {{- end }}
        {{- end }}
        volumeMounts:
        - name: data
          mountPath: /data
        {{- if .Values.tls.selfSigned.enabled }}
        - name: tls-certs
          mountPath: /certs
          readOnly: true
        {{- end }}
        livenessProbe:
          httpGet:
            path: /
            port: http
            {{- if .Values.tls.selfSigned.enabled }}
            scheme: HTTPS
            {{- end }}
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
            {{- if .Values.tls.selfSigned.enabled }}
            scheme: HTTPS
            {{- end }}
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        {{- if .Values.resources }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}
      volumes:
      {{- if .Values.persistence.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-pvc
      {{- else }}
      - name: data
        emptyDir: {}
      {{- end }}
      {{- if .Values.tls.selfSigned.enabled }}
      - name: tls-certs
        emptyDir: {}
      {{- end }}
