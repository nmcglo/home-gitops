namespace: gatus

revisionHistoryLimit: 2

image:
  repository: ghcr.io/twin/gatus
  tag: v5.35.0
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 8080
  targetPort: 8080
  loadBalancerIP: ""  # Set to a specific IP for MetalLB static assignment, e.g. "192.168.100.20"

persistence:
  enabled: true
  storageClass: "longhorn"
  accessMode: ReadWriteOnce
  size: 1Gi

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 64Mi
  # limits:
  #   cpu: 500m
  #   memory: 256Mi

# 1Password operator managed secrets.
# Each entry creates a OnePasswordItem which the operator syncs into a Kubernetes Secret
# of the same name. Fields from that secret can then be mapped to environment variables.
#
# onepasswordSecrets:
#   - name: gatus-alerting          # Name of the OnePasswordItem (and resulting K8s Secret)
#     enabled: true
#     itemPath: "vaults/MyVault/items/GatusAlerting"
#     autoRestart: "true"           # Restart pod when secret changes (default: true)
#     env:
#       - envVar: SLACK_WEBHOOK_URL  # Environment variable name inside the container
#         secretKey: webhook-url     # Field name within the 1Password item
#       - envVar: PAGERDUTY_KEY
#         secretKey: integration-key
#
#   - name: gatus-db-creds
#     enabled: false
#     itemPath: "vaults/MyVault/items/GatusDB"
#     env:
#       - envVar: DB_PASSWORD
#         secretKey: password
onepasswordSecrets:
  - name: homeassistant-examplenet
    enabled: true
    itemPath: "vaults/home-gitops/items/Home Assistant - examplenet - Long Lived Access Token"
    env:
      - envVar: HOME_ASSISTANT_TOKEN
        secretKey: credential
  
  - name: adguard-basic-auth
    enabled: true
    itemPath: "vaults/home-gitops/items/Adguard Home - Basic Creds"
    env:
      - envVar: ADGUARD_BASIC_AUTH_B64
        secretKey: credential

# Gatus configuration - see https://github.com/TwiN/gatus for full reference
config: |
  storage:
    type: sqlite
    path: /data/data.db

  web:
    port: 8080

  ui:
    title: "Status"
    header: "Status"

  endpoints:
    - name: Home Assistant
      group: Core
      url: https://ha.example.net/api/
      method: GET
      interval: 5m
      client:
        timeout: 10s
      headers:
        Authorization: "Bearer $HOME_ASSISTANT_TOKEN"
      conditions:
        - "[STATUS] == 200"
        - "[RESPONSE_TIME] < 1000"

    - name: Garage S3 COS
      group: Core
      url: https://garage.example.net/api/v2/GetClusterHealth
      method: GET
      conditions:
        - "[STATUS] == 200"
      interval: 5m

    - name: NGINX Proxy Manager
      group: Core
      url:  https://proxy.example.net/api/
      method: GET
      client:
        timeout: 10s
      conditions:
        - "[STATUS] == 200"
      interval: 5m
    
    - name: AdGuard Home
      group: Core
      url: https://adguard1.example.net/control/status
      method: GET
      client:
        timeout: 10s
      headers:
        Authorization: "Basic $ADGUARD_BASIC_AUTH_B64"
      conditions:
        - "[STATUS] == 200"
      interval: 5m

    - name: ArgoCD
      group: Core
      url: https://argocd.example.net/api/version
      method: GET
      client:
        timeout: 10s
      conditions:
        - "[STATUS] == 200"
      interval: 5m
    
    - name: CNCF Distribution Registry
      group: Core
      url: https://registry.example.net/v2/
      method: GET
      client:
        timeout: 10s
      conditions:
        - "[STATUS] == 200"
      interval: 5m

    - name: Grafana
      group: Core
      url: https://grafana.example.net/api/health
      method: GET
      client:
        timeout: 10s
      conditions:
        - "[STATUS] == 200"
      interval: 5m

    - name: Prometheus
      group: Core
      url: https://prometheus.example.net/api/v1/status/runtimeinfo
      method: GET
      client:
        timeout: 10s
      conditions:
        - "[STATUS] == 200"
      interval: 5m

    - name: Emby
      group: Home
      url: https://emby.example.net/emby/system/info/public
      method: GET
      client:
        timeout: 10s
      conditions:
        - "[STATUS] == 200"
      interval: 5m

    - name: Kiwix
      group: Home
      url: https://kiwix.example.net/
      method: GET
      client:
        timeout: 10s
      conditions:
        - "[STATUS] == 200"
      interval: 5m
    
    - name: Mealie
      group: Home
      url: https://mealie.example.net/api/app/about
      method: GET
      client:
        timeout: 10s
      conditions:
        - "[STATUS] == 200"
      interval: 5m

    - name: Longhorn
      group: Cluster
      url: https://longhorn.example.net/v1/volumes
      method: GET
      client:
        timeout: 10s
      conditions:
        - "[STATUS] == 200"
      interval: 5m
    
    - name: Open WebUI
      group: Local LLMs
      url: https://chat.example.net/
      method: GET
      client:
        timeout: 10s
      conditions:
        - "[STATUS] == 200"
      interval: 5m
