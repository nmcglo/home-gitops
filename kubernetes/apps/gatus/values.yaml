namespace: gatus

revisionHistoryLimit: 2

image:
  repository: ghcr.io/twin/gatus
  tag: v5.35.0
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 8080
  targetPort: 8080
  loadBalancerIP: ""  # Set to a specific IP for MetalLB static assignment, e.g. "192.168.100.20"

persistence:
  enabled: true
  storageClass: "longhorn"
  accessMode: ReadWriteOnce
  size: 1Gi

resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 64Mi
  # limits:
  #   cpu: 500m
  #   memory: 256Mi

# 1Password operator managed secrets.
# Each entry creates a OnePasswordItem which the operator syncs into a Kubernetes Secret
# of the same name. Fields from that secret can then be mapped to environment variables.
#
# onepasswordSecrets:
#   - name: gatus-alerting          # Name of the OnePasswordItem (and resulting K8s Secret)
#     enabled: true
#     itemPath: "vaults/MyVault/items/GatusAlerting"
#     autoRestart: "true"           # Restart pod when secret changes (default: true)
#     env:
#       - envVar: SLACK_WEBHOOK_URL  # Environment variable name inside the container
#         secretKey: webhook-url     # Field name within the 1Password item
#       - envVar: PAGERDUTY_KEY
#         secretKey: integration-key
#
#   - name: gatus-db-creds
#     enabled: false
#     itemPath: "vaults/MyVault/items/GatusDB"
#     env:
#       - envVar: DB_PASSWORD
#         secretKey: password
onepasswordSecrets:
  - name: homeassistant-examplenet
    enabled: true
    itemPath: "vaults/home-gitops/items/Home Assistant - examplenet - Long Lived Access Token"
    env:
      - envVar: HOME_ASSISTANT_TOKEN
        secretKey: credential

  - name: adguard-hasos-basic-auth
    enabled: true
    itemPath: "vaults/home-gitops/items/Home Asisstant Examplenet - Basic Credentials"
    env:
      - envVar: HOME_ASSISTANT_BASIC_AUTH_B64
        secretKey: credential

  - name: adguard-basic-auth
    enabled: true
    itemPath: "vaults/home-gitops/items/Adguard Home - Basic Creds"
    env:
      - envVar: ADGUARD_BASIC_AUTH_B64
        secretKey: credential

  - name: paperless-ngx-creds
    enabled: true
    itemPath: "vaults/home-gitops/items/Paperless API Token"
    env:
      - envVar: PAPERLESS_API_TOKEN
        secretKey: credential
  - name: homeassistant-webhook
    enabled: true
    itemPath: "vaults/home-gitops/items/HomeAssistant - gatus status webhook"
    env:
      - envVar: HOME_ASSISTANT_WEBHOOK_URL
        secretKey: URL

# Gatus configuration - see https://github.com/TwiN/gatus for full reference
config: |
  storage:
    type: sqlite
    path: /data/data.db

  web:
    port: 8080

  ui:
    title: "Status"
    header: "Status"

  alerting:
    webhook:
      url: "$HOME_ASSISTANT_WEBHOOK_URL"
      method: POST
      body: |
        {
          "endpoint": "[ENDPOINT_NAME]",
          "group": "[ENDPOINT_GROUP]",
          "url": "[ENDPOINT_URL]",
          "status": "[ALERT_TRIGGERED_OR_RESOLVED]",
          "description": "[ALERT_DESCRIPTION]"
        }
      headers:
        Content-Type: application/json
      default-alert:
        description: "Service health check failed"
        failure-threshold: 2
        success-threshold: 1
        send-on-resolved: true
        enabled: true

  endpoints:
    - name: Longhorn
      group: Example.net Cluster Critical Components
      url: https://longhorn.example.net/v1/volumes
      method: GET
      client:
        timeout: 10s
      conditions:
        - "[STATUS] == 200"
      interval: 5m

    - name: MetalLB
      group: Example.net Cluster Critical Components
      url: https://metallb.cluster.example.net/metrics
      method: GET
      client:
        timeout: 10s
      conditions:
        - "[STATUS] == 200"
      interval: 5m

    - name: Traefik
      group: Example.net Cluster Critical Components
      url: https://traefik.cluster.example.net/ping
      method: GET
      client:
        timeout: 10s
      conditions:
        - "[STATUS] == 200"
      interval: 5m
    
    - name: 1Password Connect Operator
      group: Example.net Cluster Critical Components
      url: https://onepassword.cluster.example.net/health
      method: GET
      client:
        timeout: 10s
      conditions:
        - "[STATUS] == 200"
      interval: 5m

    - name: Cert Manager (controller)
      group: Example.net Cluster Critical Components
      url: "http://cert-manager.cert-manager.svc.cluster.local:9402/metrics"
      interval: 5m
      conditions:
        - "[STATUS] == 200"

    - name: Cert Manager (webhook health)
      group: Example.net Cluster Critical Components
      url: "http://cert-manager-webhook.cert-manager.svc.cluster.local:9402/metrics"
      interval: 5m
      conditions:
        - "[STATUS] == 200"

    - name: Garage S3 COS
      group: Example.Net Infrastructure
      url: https://garage.example.net/api/v2/GetClusterHealth
      method: GET
      conditions:
        - "[STATUS] == 200"
      interval: 5m

    - name: NGINX Proxy Manager
      group: Example.Net Infrastructure
      url:  https://proxy.example.net/api/
      method: GET
      client:
        timeout: 10s
      conditions:
        - "[STATUS] == 200"
      interval: 5m

    - name: AdGuard Home Sync
      group: Example.Net Infrastructure
      url: https://adguard-sync.example.net/healthz
      method: GET
      client:
        timeout: 10s
      conditions:
        - "[STATUS] == 200"

    - name: AdGuard Home (HAOS)
      group: Example.Net Infrastructure
      url: https://adguard.example.net/control/status
      method: GET
      client:
        timeout: 10s
      headers:
        Authorization: "Basic $HOME_ASSISTANT_BASIC_AUTH_B64"
      conditions:
        - "[STATUS] == 200"
      interval: 5m

    - name: AdGuard Home (Cluster)
      group: Example.Net Infrastructure
      url: https://adguard1.example.net/control/status
      method: GET
      client:
        timeout: 10s
      headers:
        Authorization: "Basic $ADGUARD_BASIC_AUTH_B64"
      conditions:
        - "[STATUS] == 200"
      interval: 5m

    - name: ArgoCD
      group: Example.Net Infrastructure
      url: https://argocd.example.net/api/version
      method: GET
      client:
        timeout: 10s
      conditions:
        - "[STATUS] == 200"
      interval: 5m

    - name: CNCF Distribution Registry
      group: Example.Net Infrastructure
      url: https://registry.example.net/v2/
      method: GET
      client:
        timeout: 10s
      conditions:
        - "[STATUS] == 200"
      interval: 5m

    - name: Forgejo
      group: Example.Net Infrastructure
      url: https://forgejo.example.net/api/v1/version
      method: GET
      client:
        timeout: 10s
      conditions:
        - "[STATUS] == 200"
      interval: 5m

    - name: Forgejo Certificate
      group: Example.Net Infrastructure
      url: "https://forgejo.example.net"
      interval: 5m
      conditions:
        - "[STATUS] == 200"
        - "[CERTIFICATE_EXPIRATION] > 120h"   # warn 5 days out

    - name: Forgejo SSH
      group: Example.Net Infrastructure
      url: "tcp://forgejo.example.net:22"
      interval: 5m
      conditions:
        - "[CONNECTED] == true"

